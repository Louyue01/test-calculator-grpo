# 独立原生 Linux 配置；保持已验收的小批次协议，不同时调整 backend/offload/Graph。
defaults:
  - ppo_trainer
  - _self_

# Hydra 只读取主配置的搜索路径，不能仅依赖继承文件中的声明。
hydra:
  searchpath:
    - file://${oc.env:VERL_CONFIG_DIR}

actor_rollout_ref:
  model:
    # 必须先下载并核验 Qwen3-0.6B 的固定 revision，再显式指定快照目录。
    # revision: c1899de289a04d12100db370d81485cdf75e47ca
    # 上游配置没有 revision 键，禁止使用未固定版本的 Hub ID 作为默认值。
    path: ${oc.env:CALCULATOR_MODEL_PATH}
    enable_gradient_checkpointing: true
    use_remove_padding: true
  actor:
    optim:
      lr: 1.0e-6
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 1
    use_dynamic_bsz: false
    ppo_max_token_len_per_gpu: 1024
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_epochs: 1
    data_loader_seed: 42
    fsdp_config:
      model_dtype: bfloat16
      param_offload: false
      optimizer_offload: true
  rollout:
    name: sglang
    mode: async
    temperature: 0.8
    top_k: -1
    top_p: 1.0
    full_determinism: true
    seed: 42
    gpu_memory_utilization: 0.4
    # 保持 torch_native 与现有 Piecewise Graph 策略；远端性能调整另行批准。
    enforce_eager: true
    max_model_len: 1024
    tensor_model_parallel_size: 1
    max_num_batched_tokens: 4096
    max_num_seqs: 4
    engine_kwargs:
      sglang:
        max_total_tokens: 4096
        attention_backend: torch_native
    checkpoint_engine:
      update_weights_bucket_megabytes: 64
    log_prob_micro_batch_size_per_gpu: 1
    n: 4
    val_kwargs:
      temperature: 0
      n: 1
      do_sample: false
    multi_turn:
      enable: true
      function_tool_path: ${oc.env:CALCULATOR_AGENT_ROOT}/tools/calculator_function_tool.py
      max_user_turns: 1
      max_assistant_turns: 4
      max_parallel_calls: 1
      max_tool_response_length: 128
      tool_response_truncate_side: middle
      use_inference_chat_template: false
      tokenization_sanity_check_mode: strict
      format: hermes
    agent:
      num_workers: 1
      default_agent_loop: tool_agent
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    fsdp_config:
      model_dtype: bfloat16
      param_offload: false

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  use_kl_in_reward: false

data:
  train_files:
    - ${oc.env:CALCULATOR_AGENT_ROOT}/data/train.parquet
  val_files:
    - ${oc.env:CALCULATOR_AGENT_ROOT}/data/validation.parquet
  train_max_samples: 8
  val_max_samples: 32
  train_batch_size: 8
  max_prompt_length: 512
  max_response_length: 512
  filter_overlong_prompts: true
  truncation: error
  return_raw_chat: true
  seed: 42

transfer_queue:
  backend:
    SimpleStorage:
      num_data_storage_units: 2

reward:
  # 保持完整规则奖励，工具与 think 奖励均不移除。
  num_workers: 1
  custom_reward_function:
    path: ${oc.env:CALCULATOR_AGENT_ROOT}/reward_function.py
    name: compute_score
  reward_manager:
    source: register
    name: naive

trainer:
  total_epochs: 1
  total_training_steps: 1
  project_name: calculator_agent_grpo
  experiment_name: qwen3_0_6b_vast_canary
  # 恢复需单独批准，不因目录中存在历史 checkpoint 自动增加训练。
  resume_mode: disable
  default_local_dir: ${oc.env:CALCULATOR_RUN_ROOT}/checkpoints
  logger:
    - console
  nnodes: 1
  n_gpus_per_node: 1
  save_freq: 1
  test_freq: 1
  val_before_train: true
  max_actor_ckpt_to_keep: 2
  device: cuda
  use_v1: true
  v1:
    trainer_mode: sync
